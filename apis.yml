aid: sublime-systems
name: Sublime Systems
description: >-
  Sublime Systems is a Somerville, Massachusetts cement manufacturer spun out of MIT
  that makes Sublime Cement, a low-carbon replacement for ordinary portland cement.
  Its ambient-temperature electrochemical "refinery for rocks" process extracts reactive
  calcium and silicates from low-value rocks and industrial byproducts and blends them
  into an ASTM-compliant cement that drops into existing concrete mix designs and
  equipment. The company sells through general-contractor distribution partners and
  publishes no developer program, API, SDK or machine-readable contract of any kind.
